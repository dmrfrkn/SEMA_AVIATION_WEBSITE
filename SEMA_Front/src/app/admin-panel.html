<div class="admin-panel">
  <div class="admin-header">
    <h2>Admin Paneli</h2>
    <div class="admin-controls">
      <span>Hoşgeldiniz, {{username}}!</span>
      <button (click)="logout()" class="logout-btn">Çıkış Yap</button>
    </div>
  </div>

  <div class="visitors-section">
    <h3>Ziyaretçi Listesi ({{visitors.length}} kişi)</h3>
    
    <div *ngIf="visitors.length === 0" class="no-visitors">
      Henüz ziyaretçi kaydı bulunmuyor.
    </div>

    <div *ngIf="visitors.length > 0" class="visitors-table">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Ad Soyad</th>
            <th>Email</th>
            <th>Telefon</th>
            <th>Kayıt Tarihi</th>
            <th>İşlemler</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let visitor of visitors">
            <td>{{visitor.id}}</td>
            <td>{{visitor.fullName}}</td>
            <td>{{visitor.email}}</td>
            <td>{{visitor.phone}}</td>
            <td>{{visitor.registrationDate}}</td>
            <td class="actions">
              <button (click)="editVisitor(visitor)" class="edit-btn">Düzenle</button>
              <button (click)="deleteVisitor(visitor.id)" class="delete-btn">Sil</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Düzenleme Modal -->
  <div *ngIf="isEditing && selectedVisitor" class="edit-modal">
    <div class="modal-content">
      <h3>Ziyaretçi Düzenle</h3>
      <div class="edit-form">
        <div class="form-group">
          <label>Ad Soyad:</label>
          <input [(ngModel)]="selectedVisitor.fullName" type="text">
        </div>
        <div class="form-group">
          <label>Email:</label>
          <input [(ngModel)]="selectedVisitor.email" type="email">
        </div>
        <div class="form-group">
          <label>Telefon:</label>
          <input [(ngModel)]="selectedVisitor.phone" type="tel">
        </div>
        <div class="modal-actions">
          <button (click)="saveVisitor()" class="save-btn">Kaydet</button>
          <button (click)="cancelEdit()" class="cancel-btn">İptal</button>
        </div>
      </div>
    </div>
  </div>
</div>
